# E14-07. Every push: restore, build, format, L1, the architecture test, L2.
# On merge to main, additionally: L3 (E0-09), as a second job.
#
# `ContentTool validate` runs below as of E13-05. That does not close E13-06: its criterion is
# that a broken content file has been PUSHED and watched to fail the build, and nobody has done
# that yet - the same debt E14-07 carries, for the same reason.
#
# GREEN on ubuntu-latest as of 2026-08-24, after one red run and one fix. What that run
# settled, and what it did not, is recorded at the bottom of this file - it is worth reading
# once, because two of the things it proved are promises other stories depend on.
#
# STILL OWED, and E14-07 is not closed until it is done: nobody has watched this pipeline
# FAIL on purpose. Green proves the happy path; it does not prove the pipeline can report a
# failure, and a pipeline nobody has seen go red is not known to work as a gate. The check is
# to push a deliberately failing test on a scratch branch (any push triggers this), confirm
# the run is red for that reason and not another, and delete the branch. Deferred by
# decision, not forgotten.

name: CI

on: [push, pull_request]

env:
  # The editor version is pinned (standards §1). It must match what developers run, or
  # project.godot churns and exports fail in ways that do not look like build errors.
  GODOT_VERSION: 4.7.2-stable
  GODOT_ARCHIVE: Godot_v4.7.2-stable_mono_linux_x86_64

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        # Deliberately no `lfs: true`. E17-03 requires that a fresh clone builds and runs
        # with no LFS fetch at all, and the only way that promise stays true is if CI keeps
        # proving it. Turning LFS on here would hide the exact regression it guards against.

      - uses: actions/setup-dotnet@v4
        with:
          # Reads the exact SDK from global.json rather than restating it. Two places to
          # change a pinned version is one place too many.
          global-json-file: global.json

      - name: Restore
        run: dotnet restore dlo.sln

      - name: Build
        run: dotnet build dlo.sln --no-restore

      - name: Format
        # .editorconfig is the formatting authority (standards §1). If this is ever red, the
        # fix is `dotnet format`, not a discussion.
        run: dotnet format --verify-no-changes

      - name: L1 - Domain suite
        run: dotnet test tests/Dlo.Domain.Tests --no-build

      - name: Architecture test
        # Already inside L1, and run again by name on purpose: when the Dlo.Game -> Dlo.Domain
        # dependency arrow reverses, the failure should be unmistakable rather than one line
        # inside another suite's output. Standards §8: the architecture test is not decoration,
        # and when it fails the fix is never to relax it.
        run: dotnet test tests/Dlo.Domain.Tests --no-build --filter "FullyQualifiedName~ArchitectureTests"

      - name: Validate authored content
        # E13-05, and arch §7's "a content file that breaks an invariant fails the build" - the
        # only mechanism that keeps a data pipeline honest once people are authoring under
        # deadline. Before the Godot install, because a content typo should report in seconds
        # rather than after a 100 MB download.
        run: dotnet run --project tools/Dlo.ContentTool --no-build -- validate

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          set -euo pipefail
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${GODOT_ARCHIVE}.zip"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          # Located rather than hardcoded: if Godot changes its archive layout, this fails
          # here with a clear message instead of somewhere inside the test adapter.
          bin=$(find "$RUNNER_TEMP/godot" -type f -name 'Godot_v*_mono_linux.x86_64' | head -1)
          if [ -z "$bin" ]; then
            echo "No Godot binary inside ${GODOT_ARCHIVE}.zip - archive layout changed."
            exit 1
          fi
          chmod +x "$bin"
          # Smoke check before anything depends on it. If the runner image is missing a
          # library Godot needs, it fails HERE with the loader's own message, instead of
          # later as "Failed to connect: Connection timeout" from the test adapter - which
          # points at the network and is the wrong thing to go and debug.
          "$bin" --headless --version
          echo "GODOT_BIN=$bin" >> "$GITHUB_ENV"

      - name: L2 - engine suite
        # No --no-build: GdUnit4 installs its runner scene into the Godot project on first
        # run and needs Godot to compile it, so the assembly is not final until then (E14-05).
        run: dotnet test tests/Dlo.Game.Tests

  # L3 - four headless peers, on merge to main only (arch §10.6). It is a separate job rather
  # than a step so that a broken L3 is unmistakable in the checks list, and so it cannot slow
  # down the per-push loop by sitting in front of it.
  #
  # It is cheaper than arch §10.1 budgeted for: the four-peer run measured 0.63 s on Windows
  # (E0-08), against a "minutes" budget. It is still gated to main, because the reason for the
  # gate is that a network suite is the one most likely to go flaky on a shared runner, and a
  # flaky per-push gate is one people learn to re-run rather than read.
  #
  # The Godot install is duplicated from the job above rather than factored into a composite
  # action. Two copies of eight lines is cheaper than a third file to keep in step, and the
  # version already comes from one place - the env block at the top.
  l3:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore dlo.sln

      - name: Build
        # Debug, and not by accident: Godot loads a project's C# from
        # .godot/mono/temp/bin/Debug whatever configuration the harness itself was built in,
        # so a Release build here would leave the peers with no assembly to load.
        run: dotnet build dlo.sln --no-restore

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          set -euo pipefail
          curl -fsSL -o godot.zip             "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${GODOT_ARCHIVE}.zip"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          bin=$(find "$RUNNER_TEMP/godot" -type f -name 'Godot_v*_mono_linux.x86_64' | head -1)
          if [ -z "$bin" ]; then
            echo "No Godot binary inside ${GODOT_ARCHIVE}.zip - archive layout changed."
            exit 1
          fi
          chmod +x "$bin"
          "$bin" --headless --version
          echo "GODOT_BIN=$bin" >> "$GITHUB_ENV"

      - name: L3 - four headless peers
        # The suite fails rather than skips when GODOT_BIN is missing (FourPeerSession). An L3
        # suite that quietly skips itself is worse than no L3 suite: it reports green.
        run: dotnet test tests/Dlo.Net.Tests --no-build

# ---------------------------------------------------------------------------
# What the first CI runs actually settled
# ---------------------------------------------------------------------------
#
# Three things differed on ubuntu-latest and none could be checked from the Windows
# development machine. All three now have an answer from a real run rather than an argument.
#
#   1. Godot headless. RED on the first run, then fixed. GdUnit4 launches Godot twice: the
#      compile pass passes --headless, the test-runner pass does not. With no display the
#      process exits 1, and because it is gone the adapter reports "Failed to connect:
#      Connection timeout" - which points at the network and is the wrong thing to debug.
#      Read that pair of lines as "the Godot process died before it could accept a
#      connection". Fixed by <Parameters>--headless</Parameters> in .runsettings, wired in
#      through Directory.Build.props so no command line changes. Reproduced locally first, by
#      making Godot quit early and watching the identical error appear.
#
#   2. Line endings. GREEN, and this is the one worth noticing. `dotnet format
#      --verify-no-changes` passing on Linux is the first cross-platform evidence that
#      E14-08's `* text=auto eol=lf` actually holds - until this run, "a Windows clone and a
#      Linux clone produce identical diffs" had been measured on Windows alone, which is to
#      say not measured at all. The claim is now tested on every push, which is the only
#      place a line-endings promise can survive.
#
#   3. GdUnit4's runner scene. GREEN. The adapter installs and compiles it inside the Godot
#      project during the L2 step, on a fresh checkout where the directory does not exist and
#      is gitignored. It was the step with the most moving parts and it needed none of them
#      pinned down.
#
#   Also settled in passing: the runner image has whatever shared libraries Godot needs. The
#   `--version` smoke check in the install step is what will say otherwise if that changes,
#   and it now separates that failure from anything the test adapter reports.
